# Weekly dependency updates. Minor and patch updates are grouped per
# ecosystem; major updates arrive as separate pull requests. Nothing is
# merged automatically.
version: 2

updates:
  # JavaScript workspace (pnpm): root package.json, contracts, server, web.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    # Wait a week before proposing a new version, so a compromised or broken
    # release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript, which generates the contract types, requires
      # TypeScript 5. Move to a new TypeScript major only together with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The runtime is Node.js 24, so its type definitions follow the
      # Node.js major in use rather than the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Agent: central package management and NuGet lock files under agent/,
  # plus the WixToolset.Sdk MSBuild SDK in agent/global.json "msbuild-sdks".
  - package-ecosystem: nuget
    directory: /agent
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    # Wait a week before proposing a new version, so a compromised or broken
    # release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # WiX 6 and later require accepting the Open Source Maintenance Fee
      # EULA. That is a maintainer decision, never an automatic update, so
      # WiX stays on 5.x until it is made.
      - dependency-name: "WixToolset.*"
        versions: [">= 6"]

  # Application image: config/docker/app.Dockerfile (Dependabot matches any
  # file name containing "Dockerfile").
  - package-ecosystem: docker
    directory: /config/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    # Wait a week before proposing a new version, so a compromised or broken
    # release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Actions pinned by commit SHA in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    # Wait a week before proposing a new version, so a compromised or broken
    # release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
